<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
<link rel="stylesheet" href="style1.css">
</head>

<body class="main">

    <div class="form-box registration">

        <h2>Registration Page</h2>

        <form>

            <table>

                <tr>
                    <td>Full Name:</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email">
                    </td>
                </tr>

                <tr>
                    <td>Phone:</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Sex:</td>
                    <td>
                        <label class="sex">
                            <input type="radio" name="sex" value="Male">Male</label>
                        <label class="sex">
                            <input type="radio" name="Female" value="Female">Female</label>
                    </td>
                </tr>

                <tr>
                    <td>Date of Birth:</td>
                    <td>
                        <input type="date" type="month" type="year">
                    </td>
                </tr>

                <tr>
                    <td>Language Known:</td>
                    <td>
                        <input type="checkbox" id="eng" name="lang" value="lang">
                        <label for="eng">English</label>
                        <br>
                        <input type="checkbox" id="hin" name="lang" value="lang">
                        <label for="hin">Hindi</label>
                        <br>
                        <input type="checkbox" id="tel" name="lang" value="lang">
                        <label for="tel">Telgu</label>
                        <br>
                        <input type="checkbox" id="Tamil" name="lang" value="lang">
                        <label for="Tamil">Tamil</label>
                    </td>
                </tr>
                
                <tr>
                    <td>User Name:</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input type="password">
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password:</td>
                    <td>
                        <input type="password">
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
                
            </table>

        </form>

    </div>
<form onsubmit="return validateForm()">

    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <br><br>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password">
    <br><br>

    <button type="submit">Register</button>

</form>

<script>
function validateForm() {
    let name = document.getElementById("name").value.trim();
    let password = document.getElementById("password").value;

    if (name === "") {
        alert("Please enter your name");
        return false;
    }

    if (password.length < 6) {
        alert("Password must contain at least 6 characters");
        return false;
    }

    alert("Registration successful!");
    return true;
}
</script>
</body>
</html>
